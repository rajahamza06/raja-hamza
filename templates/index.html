<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Job Agent - Find Your Next Opportunity</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
            color: white;
        }

        .header h1 {
            font-size: 3rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .search-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .search-form {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        .form-group input, .form-group textarea {
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .search-btn {
            grid-column: span 2;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .search-btn:hover {
            transform: translateY(-2px);
        }

        .search-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .results-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 2px solid #f0f0f0;
        }

        .export-buttons {
            display: flex;
            gap: 10px;
        }

        .export-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: background-color 0.3s ease;
        }

        .export-btn:hover {
            background: #218838;
        }

        .export-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .job-card {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            margin-bottom: 20px;
            border-left: 4px solid #667eea;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .job-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        .job-title {
            font-size: 1.3rem;
            font-weight: 600;
            color: #667eea;
            margin-bottom: 10px;
        }

        .job-company {
            font-size: 1.1rem;
            font-weight: 500;
            color: #555;
            margin-bottom: 8px;
        }

        .job-details {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .job-detail {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .job-detail i {
            color: #667eea;
            width: 20px;
        }

        .job-email {
            background: #e3f2fd;
            padding: 8px 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 14px;
            color: #1976d2;
        }

        .job-url {
            color: #667eea;
            text-decoration: none;
            font-weight: 500;
        }

        .job-url:hover {
            text-decoration: underline;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error {
            background: #f8d7da;
            color: #721c24;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #f5c6cb;
        }

        .success {
            background: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            border: 1px solid #c3e6cb;
        }

        @media (max-width: 768px) {
            .search-form {
                grid-template-columns: 1fr;
            }
            
            .search-btn {
                grid-column: span 1;
            }
            
            .results-header {
                flex-direction: column;
                gap: 15px;
                align-items: stretch;
            }
            
            .export-buttons {
                justify-content: center;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤖 Remote Job Agent</h1>
            <p>Find your next remote opportunity with AI-powered job search</p>
        </div>

        <div class="search-section">
            <h2 style="margin-bottom: 20px; color: #555;">🔍 Search for Remote Jobs</h2>
            <form class="search-form" id="searchForm">
                <div class="form-group">
                    <label for="query">Job Keywords</label>
                    <input type="text" id="query" name="query" placeholder="e.g., remote hourly developer" value="remote hourly">
                </div>
                
                <div class="form-group">
                    <label for="skills">Your Skills (optional)</label>
                    <textarea id="skills" name="skills" placeholder="e.g., Python, JavaScript, React" rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="rate">Preferred Hourly Rate (optional)</label>
                    <input type="text" id="rate" name="rate" placeholder="e.g., $30+">
                </div>
                
                <div class="form-group">
                    <label for="maxResults">Maximum Results</label>
                    <input type="number" id="maxResults" name="maxResults" value="20" min="5" max="100">
                </div>
                
                <button type="submit" class="search-btn" id="searchBtn">
                    <i class="fas fa-search"></i> Search Jobs
                </button>
            </form>
        </div>

        <div class="results-section" id="resultsSection" style="display: none;">
            <div class="results-header">
                <h2 id="resultsTitle">🎯 Job Results</h2>
                <div class="export-buttons">
                    <button class="export-btn" id="exportCsvBtn" disabled>
                        <i class="fas fa-download"></i> Export CSV
                    </button>
                    <button class="export-btn" id="exportExcelBtn" disabled>
                        <i class="fas fa-file-excel"></i> Export Excel
                    </button>
                </div>
            </div>
            
            <div id="resultsContent"></div>
        </div>
    </div>

    <script>
        let currentJobs = [];

        document.getElementById('searchForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const searchBtn = document.getElementById('searchBtn');
            const resultsSection = document.getElementById('resultsSection');
            const resultsContent = document.getElementById('resultsContent');
            
            // Show loading state
            searchBtn.disabled = true;
            searchBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Searching...';
            
            // Get form data
            const formData = new FormData(this);
            const searchData = {
                query: formData.get('query'),
                skills: formData.get('skills').split(',').map(s => s.trim()).filter(s => s),
                rate: formData.get('rate'),
                max_results: parseInt(formData.get('maxResults'))
            };
            
            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(searchData)
                });
                
                const result = await response.json();
                
                if (result.success) {
                    currentJobs = result.jobs;
                    displayResults(result.jobs);
                    resultsSection.style.display = 'block';
                    
                    // Enable export buttons
                    document.getElementById('exportCsvBtn').disabled = false;
                    document.getElementById('exportExcelBtn').disabled = false;
                } else {
                    showError(result.error || 'Search failed');
                }
                
            } catch (error) {
                showError('Network error: ' + error.message);
            } finally {
                // Reset button state
                searchBtn.disabled = false;
                searchBtn.innerHTML = '<i class="fas fa-search"></i> Search Jobs';
            }
        });

        function displayResults(jobs) {
            const resultsTitle = document.getElementById('resultsTitle');
            const resultsContent = document.getElementById('resultsContent');
            
            resultsTitle.textContent = `🎯 Found ${jobs.length} Job Opportunities`;
            
            if (jobs.length === 0) {
                resultsContent.innerHTML = '<div class="loading">No jobs found matching your criteria.</div>';
                return;
            }
            
            let html = '';
            jobs.forEach((job, index) => {
                html += `
                    <div class="job-card">
                        <div class="job-title">${job.title}</div>
                        <div class="job-company">${job.company}</div>
                        
                        <div class="job-details">
                            <div class="job-detail">
                                <i class="fas fa-building"></i>
                                <span><strong>Agency:</strong> ${job.agency}</span>
                            </div>
                            <div class="job-detail">
                                <i class="fas fa-envelope"></i>
                                <span><strong>Email:</strong></span>
                            </div>
                            <div class="job-detail">
                                <i class="fas fa-dollar-sign"></i>
                                <span><strong>Rate:</strong> ${job.hourly_rate || 'Not specified'}</span>
                            </div>
                            <div class="job-detail">
                                <i class="fas fa-map-marker-alt"></i>
                                <span><strong>Location:</strong> ${job.location}</span>
                            </div>
                            <div class="job-detail">
                                <i class="fas fa-clock"></i>
                                <span><strong>Type:</strong> ${job.job_type}</span>
                            </div>
                            <div class="job-detail">
                                <i class="fas fa-calendar"></i>
                                <span><strong>Posted:</strong> ${job.posted_date}</span>
                            </div>
                            <div class="job-detail">
                                <i class="fas fa-globe"></i>
                                <span><strong>Source:</strong> ${job.source}</span>
                            </div>
                        </div>
                        
                        <div class="job-email">${job.email}</div>
                        
                        <div style="margin-top: 15px;">
                            <a href="${job.job_url}" target="_blank" class="job-url">
                                <i class="fas fa-external-link-alt"></i> View Job Details
                            </a>
                        </div>
                    </div>
                `;
            });
            
            resultsContent.innerHTML = html;
        }

        function showError(message) {
            const resultsSection = document.getElementById('resultsSection');
            const resultsContent = document.getElementById('resultsContent');
            
            resultsSection.style.display = 'block';
            resultsContent.innerHTML = `<div class="error">❌ ${message}</div>`;
        }

        // Export functionality
        document.getElementById('exportCsvBtn').addEventListener('click', async function() {
            await exportJobs('csv');
        });

        document.getElementById('exportExcelBtn').addEventListener('click', async function() {
            await exportJobs('excel');
        });

        async function exportJobs(format) {
            if (currentJobs.length === 0) {
                alert('No jobs to export');
                return;
            }
            
            try {
                const response = await fetch(`/export/${format}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ jobs: currentJobs })
                });
                
                if (response.ok) {
                    const blob = await response.blob();
                    const url = window.URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = `remote_jobs_${new Date().toISOString().slice(0,10)}.${format}`;
                    document.body.appendChild(a);
                    a.click();
                    window.URL.revokeObjectURL(url);
                    document.body.removeChild(a);
                } else {
                    const error = await response.json();
                    alert('Export failed: ' + error.error);
                }
                
            } catch (error) {
                alert('Export failed: ' + error.message);
            }
        }
    </script>
</body>
</html>
